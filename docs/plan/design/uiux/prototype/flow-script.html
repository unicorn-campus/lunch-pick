<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>런치픽 — 사용자 플로우 프리젠테이션</title>
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0F0F14;
      --surface: #1A1A24;
      --surface-hover: #24243A;
      --border: #2E2E42;
      --text: #E8E8F0;
      --text-dim: #8888A0;
      --primary: #FF6B35;
      --primary-dim: rgba(255,107,53,0.15);
      --success: #10B981;
      --radius: 12px;
      --font: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ===== Top Bar ===== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }
    .top-bar__brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .top-bar__logo {
      width: 32px; height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .top-bar__title {
      font-size: 16px;
      font-weight: 700;
    }
    .top-bar__subtitle {
      font-size: 12px;
      color: var(--text-dim);
      margin-left: 8px;
    }
    .top-bar__controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .flow-selector {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border-radius: 8px;
      padding: 3px;
    }
    .flow-tab {
      padding: 6px 14px;
      border: none;
      background: none;
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .flow-tab:hover { color: var(--text); }
    .flow-tab.active {
      background: var(--primary);
      color: #fff;
    }
    .kbd-hint {
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 5px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 11px;
      font-family: var(--font);
      color: var(--text-dim);
    }

    /* ===== Main 3-Panel Layout ===== */
    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ===== Left: Step List ===== */
    .step-list {
      width: 260px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px 0;
      background: var(--surface);
    }
    .step-list__flow-title {
      padding: 8px 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
    }
    .step-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
    }
    .step-item:hover { background: var(--surface-hover); }
    .step-item.active { background: var(--primary-dim); }
    .step-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--primary);
      border-radius: 0 3px 3px 0;
    }
    .step-item.completed .step-num {
      background: var(--success);
      border-color: var(--success);
    }
    .step-num {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .step-item.active .step-num {
      border-color: var(--primary);
      color: var(--primary);
    }
    .step-item.completed .step-num { color: #fff; }
    .step-label {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.3;
    }
    .step-label__sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }
    .step-connector {
      width: 1px;
      height: 12px;
      background: var(--border);
      margin-left: 32px;
    }

    /* ===== Center: Phone Frame ===== */
    .phone-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    .phone-frame {
      width: 375px;
      height: 680px;
      border: 2px solid var(--border);
      border-radius: 40px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      position: relative;
    }
    .phone-frame__notch {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 28px;
      background: #000;
      border-radius: 0 0 16px 16px;
      z-index: 10;
    }
    .phone-frame__screen {
      width: 100%;
      height: 100%;
      border: none;
    }
    .phone-nav {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .nav-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .nav-btn:disabled:hover {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text);
    }
    .nav-counter {
      font-size: 13px;
      color: var(--text-dim);
      min-width: 50px;
      text-align: center;
    }

    /* ===== Right: Narration ===== */
    .narration-panel {
      width: 320px;
      flex-shrink: 0;
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 24px;
      background: var(--surface);
    }
    .narration__screen-name {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      margin-bottom: 8px;
    }
    .narration__title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .narration__desc {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-dim);
      margin-bottom: 20px;
    }
    .narration__section {
      margin-bottom: 20px;
    }
    .narration__section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .narration__list {
      list-style: none;
      padding: 0;
    }
    .narration__list li {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-dim);
      padding: 3px 0;
      padding-left: 16px;
      position: relative;
    }
    .narration__list li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--primary);
    }
    .narration__tag {
      display: inline-flex;
      padding: 3px 8px;
      background: var(--primary-dim);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
      margin-right: 4px;
      margin-bottom: 4px;
    }
    .narration__divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }
    .narration__solution {
      padding: 12px;
      background: var(--bg);
      border-radius: 8px;
      border-left: 3px solid var(--primary);
    }
    .narration__solution-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .narration__solution-text {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-dim);
    }

    /* ===== Progress Bar ===== */
    .progress-bar {
      height: 3px;
      background: var(--bg);
      flex-shrink: 0;
    }
    .progress-bar__fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s ease;
    }

    /* ===== Responsive ===== */
    @media (max-width: 1100px) {
      .narration-panel { display: none; }
    }
    @media (max-width: 800px) {
      .step-list { display: none; }
      .phone-frame {
        width: 320px;
        height: 580px;
        border-radius: 32px;
      }
    }
    @media (max-width: 600px) {
      .top-bar { padding: 10px 16px; }
      .flow-selector { overflow-x: auto; }
      .kbd-hint { display: none; }
      .phone-area { padding: 16px; }
      .phone-frame {
        width: 280px;
        height: 510px;
        border-radius: 28px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">

  <!-- Main Layout -->

        <span class="nav-counter" id="navCounter">1 / 5</span>
        <button class="nav-btn" id="btnNext" onclick="nextStep()" aria-label="다음">&#8594;</button>
      </div>
    </div>

    <!-- Right: Narration -->
    <div class="narration-panel" id="narrationPanel"></div>
  </div>

    /* ========== State ========== */
    var currentFlowIdx = 0;
    var currentStepIdx = 0;

    /* ========== Init ========== */
    document.addEventListener('DOMContentLoaded', function() {
      renderFlowTabs();
      loadFlow(0);
    });

    /* ========== Flow Tabs ========== */
    function renderFlowTabs() {
      var container = document.getElementById('flowSelector');
      FLOWS.forEach(function(flow, i) {
        var btn = document.createElement('button');
        btn.className = 'flow-tab' + (i === 0 ? ' active' : '');
        btn.textContent = flow.name;
        btn.onclick = function() { loadFlow(i); };
        btn.dataset.idx = i;
        container.appendChild(btn);
      });
    }

    /* ========== Load Flow ========== */
    function loadFlow(flowIdx) {
      currentFlowIdx = flowIdx;
      currentStepIdx = 0;

      // Update tabs
      document.querySelectorAll('.flow-tab').forEach(function(tab, i) {
        tab.classList.toggle('active', i === flowIdx);
      });

      renderStepList();
      goToStep(0);
    }

    /* ========== Step List ========== */
    function renderStepList() {
      var flow = FLOWS[currentFlowIdx];
      var list = document.getElementById('stepList');
      list.innerHTML = '';

      var title = document.createElement('div');
      title.className = 'step-list__flow-title';
      title.textContent = 'FLOW ' + (currentFlowIdx + 1) + ' — ' + flow.name;
      list.appendChild(title);

      flow.steps.forEach(function(step, i) {
        if (i > 0) {
          var conn = document.createElement('div');
          conn.className = 'step-connector';
          list.appendChild(conn);
        }
        var item = document.createElement('div');
        item.className = 'step-item';
        item.dataset.idx = i;
        item.onclick = function() { goToStep(i); };
        item.innerHTML =
          '<div class="step-num">' + (i + 1) + '</div>' +
          '<div><div class="step-label">' + step.label + '</div>' +
          '<div class="step-label__sub">' + step.sub + '</div></div>';
        list.appendChild(item);
      });
    }

    /* ========== Go To Step ========== */
    function goToStep(stepIdx) {
      var flow = FLOWS[currentFlowIdx];
      if (stepIdx < 0 || stepIdx >= flow.steps.length) return;

      currentStepIdx = stepIdx;
      var step = flow.steps[stepIdx];

      // Update iframe
      document.getElementById('phoneScreen').src = step.screen;

      // Update step list active/completed
      document.querySelectorAll('.step-item').forEach(function(item, i) {
        item.classList.remove('active', 'completed');
        if (i < stepIdx) item.classList.add('completed');
        if (i === stepIdx) item.classList.add('active');
      });

      // Scroll active step into view
      var activeItem = document.querySelector('.step-item.active');
      if (activeItem) activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      // Update nav counter
      document.getElementById('navCounter').textContent = (stepIdx + 1) + ' / ' + flow.steps.length;
      document.getElementById('btnPrev').disabled = stepIdx === 0;
      document.getElementById('btnNext').disabled = stepIdx === flow.steps.length - 1;

      // Update progress
      var pct = flow.steps.length > 1 ? (stepIdx / (flow.steps.length - 1)) * 100 : 100;
      document.getElementById('progressFill').style.width = pct + '%';

      // Update narration
      renderNarration(step.narration);
    }

    /* ========== Narration ========== */
    function renderNarration(n) {
      var panel = document.getElementById('narrationPanel');
      var html = '';

      html += '<div class="narration__screen-name">' + n.screenName + '</div>';
      html += '<h2 class="narration__title">' + n.title + '</h2>';
      html += '<p class="narration__desc">' + n.desc + '</p>';

      // Tags
      if (n.tags && n.tags.length) {
        html += '<div style="margin-bottom:16px;">';
        n.tags.forEach(function(t) {
          html += '<span class="narration__tag">' + t + '</span>';
        });
        html += '</div>';
      }

      html += '<hr class="narration__divider">';

      // UX Points
      html += '<div class="narration__section">';
      html += '<div class="narration__section-title">UX 포인트</div>';
      html += '<ul class="narration__list">';
      n.ux.forEach(function(point) {
        html += '<li>' + point + '</li>';
      });
      html += '</ul></div>';

      // Solution Mapping
      if (n.solution) {
        html += '<div class="narration__solution">';
        html += '<div class="narration__solution-label">핵심 솔루션 ' + n.solution.code + '</div>';
        html += '<div class="narration__solution-text">' + n.solution.text + '</div>';
        html += '</div>';
      }

      panel.innerHTML = html;
    }

    /* ========== Navigation ========== */
    function prevStep() { goToStep(currentStepIdx - 1); }
    function nextStep() { goToStep(currentStepIdx + 1); }

    /* ========== Keyboard ========== */
    document.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.key === 'ArrowLeft' || e.key === 'Left') {
        e.preventDefault();
        prevStep();
      } else if (e.key === 'ArrowRight' || e.key === 'Right') {
        e.preventDefault();
        nextStep();
      } else if (e.key >= '1' && e.key <= '4') {
        var idx = parseInt(e.key) - 1;
        if (idx < FLOWS.length) loadFlow(idx);
      }
    });
  </script>
