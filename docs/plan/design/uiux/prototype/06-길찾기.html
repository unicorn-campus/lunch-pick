<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>런치픽 - 길찾기</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .nav-restaurant {
      padding: var(--space-m) 0;
    }
    .nav-restaurant__name {
      font-size: var(--font-size-h2);
      font-weight: var(--font-weight-bold);
      margin-bottom: var(--space-xs);
    }
    .nav-restaurant__address {
      font-size: var(--font-size-body2);
      color: var(--color-text-secondary);
    }
    .nav-map {
      width: 100%;
      height: 240px;
      background: linear-gradient(135deg, #E5E7EB 0%, #D1D5DB 100%);
      border-radius: var(--radius-l);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-l);
      position: relative;
      overflow: hidden;
    }
    .nav-map__placeholder {
      text-align: center;
      color: var(--color-text-secondary);
    }
    .nav-map__route {
      position: absolute;
      top: 50%;
      left: 10%;
      right: 10%;
      height: 2px;
      background: var(--color-primary);
      transform: translateY(-50%);
    }
    .nav-map__dot {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: var(--radius-full);
      top: 50%;
      transform: translateY(-50%);
    }
    .nav-map__dot--start {
      left: 10%;
      background: var(--color-info);
    }
    .nav-map__dot--end {
      right: 10%;
      background: var(--color-primary);
    }
    .nav-info {
      display: flex;
      align-items: center;
      gap: var(--space-m);
      padding: var(--space-m);
      background: var(--color-surface);
      border-radius: var(--radius-m);
      box-shadow: var(--shadow-1);
      margin-bottom: var(--space-l);
    }
    .nav-info__icon {
      font-size: 32px;
    }
    .nav-info__text {
      flex: 1;
    }
    .nav-info__time {
      font-size: var(--font-size-h3);
      font-weight: var(--font-weight-bold);
    }
    .nav-info__distance {
      font-size: var(--font-size-body2);
      color: var(--color-text-secondary);
    }
    .nav-external {
      display: flex;
      gap: var(--space-s);
      margin-bottom: var(--space-l);
    }
    .nav-external .btn {
      flex: 1;
    }
    .nav-return {
      text-align: center;
      padding: var(--space-m);
      background: #ECFDF5;
      border-radius: var(--radius-m);
      color: #065F46;
      font-size: var(--font-size-body2);
      margin-bottom: var(--space-l);
    }
    .nav-record {
      margin-top: var(--space-l);
    }
  </style>
</head>
<body>
  <app-header title="길찾기" back="05-홈.html"></app-header>

  <main role="main" class="page-container">
    <div class="nav-restaurant">
      <h1 id="restaurantName" class="nav-restaurant__name"></h1>
      <p id="restaurantAddress" class="nav-restaurant__address"></p>
    </div>

    <div class="nav-map" role="img" aria-label="도보 경로 지도">
      <div class="nav-map__route"></div>
      <div class="nav-map__dot nav-map__dot--start"></div>
      <div class="nav-map__dot nav-map__dot--end"></div>
      <div class="nav-map__placeholder">
        <div style="font-size:24px; margin-bottom:4px;">🗺️</div>
        <div>[지도 영역]</div>
      </div>
    </div>

    <div class="nav-info">
      <div class="nav-info__icon">🚶</div>
      <div class="nav-info__text">
        <div id="walkTime" class="nav-info__time"></div>
        <div id="walkDistance" class="nav-info__distance"></div>
      </div>
    </div>

    <div class="nav-external">
      <button class="btn btn-secondary" onclick="openExternalMap('kakao')" aria-label="카카오맵에서 열기">
        카카오맵에서 열기
      </button>
      <button class="btn btn-secondary" onclick="openExternalMap('naver')" aria-label="네이버지도에서 열기">
        네이버지도에서 열기
      </button>
    </div>

    <div id="returnEstimate" class="nav-return">
      💡 12:45까지 복귀 가능해요
    </div>

    <div class="nav-record">
      <button class="btn btn-primary btn-full" onclick="goToRecord()">
        식사 후 기록하기
      </button>
    </div>
  </main>

  <app-bottom-nav active="home"></app-bottom-nav>

  <script src="common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var data = getPageData();
      if (!data) {
        data = SAMPLE_DATA.recommendations[0];
      }

      document.getElementById('restaurantName').textContent = data.restaurantName;
      document.getElementById('restaurantAddress').textContent = data.address;
      document.getElementById('walkTime').textContent = '도보 ' + data.walkTime;
      document.getElementById('walkDistance').textContent = data.distance;

      localStorage.setItem('lunchpick_accepted_rec', JSON.stringify(data));
    });

    function openExternalMap(type) {
      showToast((type === 'kakao' ? '카카오맵' : '네이버지도') + '으로 이동합니다');
    }

    function goToRecord() {
      navigateTo('07-식사기록.html');
    }
  </script>
</body>
</html>
