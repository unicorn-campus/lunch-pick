  LOG_LEVEL_APP: "DEBUG"
  LOG_LEVEL_WEB: "INFO"
  LOG_LEVEL_SQL: "DEBUG"
  LOG_LEVEL_SQL_TYPE: "TRACE"
  CORS_ALLOWED_ORIGINS: "http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084,https://web.34.50.22.190.nip.io"
