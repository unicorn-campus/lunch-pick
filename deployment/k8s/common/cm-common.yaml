apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-common
  namespace: lunchpick
data:
  SPRING_PROFILES_ACTIVE: "dev"
  DB_KIND: "postgresql"
  DB_HOST: "postgres-postgresql"
  DB_PORT: "5432"
  REDIS_HOST: "redis-master"
