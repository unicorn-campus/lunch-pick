apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-ai-pipeline-service
  namespace: lunchpick
data:
  APP_ENV: "production"
  APP_PORT: "8084"
  LOG_LEVEL: "INFO"
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_USER: "lunchpick"
  REDIS_DB: "4"
  PRIMARY_MODEL_ID: "openai/gpt-oss-120b"
  PRIMARY_MODEL_PROVIDER: "openai"
  PRIMARY_MODEL_TEMPERATURE: "0.3"
  PRIMARY_MODEL_MAX_TOKENS: "1024"
  COLDSTART_MODEL_ID: "openai/gpt-oss-120b"
  COLDSTART_MODEL_PROVIDER: "openai"
  COLDSTART_MODEL_TEMPERATURE: "0.4"
  COLDSTART_MODEL_MAX_TOKENS: "1024"
  REASON_MODEL_ID: "openai/gpt-oss-120b"
  REASON_MODEL_PROVIDER: "openai"
  REASON_MODEL_TEMPERATURE: "0.5"
  REASON_MODEL_MAX_TOKENS: "512"
  CB_FAILURE_THRESHOLD: "5"
  CB_RECOVERY_TIMEOUT: "60.0"
  RATE_LIMIT_GLOBAL_PER_MINUTE: "500"
  OPENAI_API_BASE: "https://api.groq.com/openai/v1"
  LANGCHAIN_TRACING_V2: "false"
  LANGCHAIN_PROJECT: "ai-pipeline-service"
