apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-pipeline-service
  namespace: lunchpick
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-pipeline-service
  template:
    metadata:
      labels:
        app: ai-pipeline-service
    spec:
      imagePullSecrets:
        - name: lunchpick
      containers:
        - name: ai-pipeline-service
          image: hiondal/lunchpick-ai-pipeline-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cm-ai-pipeline-service
            - secretRef:
                name: secret-ai-pipeline-service
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
