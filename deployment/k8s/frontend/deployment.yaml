apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lunchpick
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: lunchpick
      containers:
        - name: frontend
          image: hiondal/lunchpick-frontend:dev-20260305132520
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          volumeMounts:
            - name: runtime-env
              mountPath: /app/public/runtime-env.js
              subPath: runtime-env.js
          startupProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: runtime-env
          configMap:
            name: cm-frontend
