# docker-compose.yml
# 프로젝트 루트에 위치. 기본 서비스는 프로파일 없이 항상 기동.
# 기본 기동:  docker compose up -d
# Mock 포함:  docker compose --profile mock up -d
# 정리:       docker compose down
# 볼륨 초기화: docker compose down -v

services:

  # -------------------------------------------------------
  # 기본 서비스 (항상 기동)
  # -------------------------------------------------------

  postgres:
    image: postgres:16
    container_name: lunchpick-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lunchpick-redis
    command: redis-server --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------
  # MQ: Redis Streams 사용 (별도 MQ 서비스 불필요)
  # payment-service → Redis DB 0 → member-service 이벤트 소비
  # 토픽: subscription-events
  # -------------------------------------------------------

  # -------------------------------------------------------
  # mock 프로파일: Prism Mock 서버 (4개 서비스 분리)
  # 기동: docker compose --profile mock up -d
  # -------------------------------------------------------

  prism-member:
    image: stoplight/prism:latest
    container_name: lunchpick-prism-member
    profiles: ["mock"]
    command: mock -h 0.0.0.0 /api/member-service-api.yaml
    volumes:
      - ./docs/design/api:/api:ro
    ports:
      - "4010:4010"

  prism-recommendation:
    image: stoplight/prism:latest
    container_name: lunchpick-prism-recommendation
    profiles: ["mock"]
    command: mock -h 0.0.0.0 --port 4011 /api/recommendation-service-api.yaml
    volumes:
      - ./docs/design/api:/api:ro
    ports:
      - "4011:4011"

  prism-payment:
    image: stoplight/prism:latest
    container_name: lunchpick-prism-payment
    profiles: ["mock"]
    command: mock -h 0.0.0.0 --port 4012 /api/payment-service-api.yaml
    volumes:
      - ./docs/design/api:/api:ro
    ports:
      - "4012:4012"

  prism-ai:
    image: stoplight/prism:latest
    container_name: lunchpick-prism-ai
    profiles: ["mock"]
    command: mock -h 0.0.0.0 --port 4013 /api/ai-pipeline-api.yaml
    volumes:
      - ./docs/design/api:/api:ro
    ports:
      - "4013:4013"

  # -------------------------------------------------------
  # ai 프로파일: AI Pipeline 서비스
  # 기동: docker compose --profile ai up -d
  # -------------------------------------------------------

  ai-pipeline-service:
    build:
      context: ./ai-pipeline-service
      dockerfile: Dockerfile
    container_name: lunchpick-ai-pipeline
    profiles:
      - ai
    ports:
      - "8084:8000"
    env_file:
      - ./ai-pipeline-service/.env
    environment:
      - APP_ENV=development
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
