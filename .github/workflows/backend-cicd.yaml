name: Backend Services CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'member-service/**'
      - 'recommendation-service/**'
      - 'payment-service/**'
      - 'common/**'
      - '.github/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      SKIP_SONARQUBE:
        description: 'Skip SonarQube Analysis'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      SERVICE:
        description: 'Target service (all = 전체 배포)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - 'member-service'
          - 'recommendation-service'
          - 'payment-service'

env:
  # ⚠️ 필수 치환: 'AWS' 기본값을 [실행정보]의 CLOUD 값으로 치환하세요.
  # Repository Variables에 CLOUD를 반드시 설정해야 합니다. 미설정 시 AWS로 동작합니다.
  CLOUD: ${{ vars.CLOUD || 'AWS' }}
  REGISTRY: ${{ vars.REGISTRY }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_outputs.outputs.image_tag }}
      environment: ${{ steps.set_outputs.outputs.environment }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Determine environment
        id: determine_env
        run: |
          # Use input parameter or default to 'dev'
          ENVIRONMENT="${{ github.event.inputs.ENVIRONMENT || vars.ENVIRONMENT || 'dev' }}"
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          TARGET_SERVICE="${{ github.event.inputs.SERVICE || 'all' }}"
          if [[ "$TARGET_SERVICE" == "all" ]]; then
            ./gradlew build -x test
          else
            ./gradlew :$TARGET_SERVICE:build -x test
          fi

      - name: Add SonarQube host entry
        run: echo "${{ secrets.SONAR_HOST_IP }} mysonar.io" | sudo tee -a /etc/hosts

      - name: SonarQube Analysis & Quality Gate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          # Check if SonarQube should be skipped
          SKIP_SONARQUBE="${{ github.event.inputs.SKIP_SONARQUBE || 'false' }}"

          if [[ "$SKIP_SONARQUBE" == "true" ]]; then
            echo "Skipping SonarQube Analysis (SKIP_SONARQUBE=$SKIP_SONARQUBE)"
            exit 0
          fi

          # Define services array
          services=(member-service recommendation-service payment-service)

          # Run tests, coverage reports, and SonarQube analysis for each service
          for service in "${services[@]}"; do
            ./gradlew :$service:test :$service:jacocoTestReport :$service:sonar \
              -Dsonar.projectKey=lunchpick-$service-${{ steps.determine_env.outputs.environment }} \
              -Dsonar.projectName=lunchpick-$service-${{ steps.determine_env.outputs.environment }} \
              -Dsonar.host.url=$SONAR_HOST_URL \
              -Dsonar.token=$SONAR_TOKEN \
              -Dsonar.java.binaries=build/classes/java/main \
              -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml \
              -Dsonar.exclusions=**/config/**,**/entity/**,**/dto/**,**/*Application.class,**/exception/**
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-builds
          path: |
            member-service/build/libs/*.jar
            recommendation-service/build/libs/*.jar
            payment-service/build/libs/*.jar

      - name: Set outputs
        id: set_outputs
        run: |
          # Generate timestamp for image tag
          IMAGE_TAG=$(date +%Y%m%d%H%M%S)
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "environment=${{ steps.determine_env.outputs.environment }}" >> $GITHUB_OUTPUT

  release:
    name: Build and Push Docker Images
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-builds

      - name: Set environment variables from build job
        run: |
          echo "REGISTRY=${{ vars.REGISTRY }}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${{ needs.build.outputs.environment }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (prevent rate limit)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Cloud-conditional registry login
      # === AWS ECR ===
      # (CLOUD == AWS일 때 사용)
      - name: Configure AWS credentials
        if: ${{ contains(env.REGISTRY, 'amazonaws.com') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.ECR_REGION }}   # GitHub Repository Variable: ECR_REGION

      - name: Login to Amazon ECR
        if: ${{ contains(env.REGISTRY, 'amazonaws.com') }}
        run: |
          aws ecr get-login-password --region ${{ vars.ECR_REGION }} | docker login --username AWS --password-stdin ${{ env.REGISTRY }}

      # === Azure ACR ===
      # (CLOUD == Azure일 때 사용)
      - name: Login to Azure Container Registry
        if: ${{ contains(env.REGISTRY, 'azurecr.io') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # === GCP Artifact Registry ===
      # (CLOUD == GCP일 때 사용)
      - name: Authenticate to Google Cloud
        if: ${{ contains(env.REGISTRY, 'pkg.dev') }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Login to Google Artifact Registry
        if: ${{ contains(env.REGISTRY, 'pkg.dev') }}
        run: |
          gcloud auth configure-docker ${{ vars.GCR_REGION }}-docker.pkg.dev  # GitHub Repository Variable: GCR_REGION

      - name: Build and push Docker images
        run: |
          # 서비스명과 이미지명 병렬 배열 (K8s Deployment YAML에서 추출한 이미지명)
          services=(member-service recommendation-service payment-service)
          img_names=(hiondal/lunchpick-member-service hiondal/lunchpick-recommendation-service hiondal/lunchpick-payment-service)
          TARGET_SERVICE="${{ github.event.inputs.SERVICE || 'all' }}"

          # Build and push each service image
          for i in "${!services[@]}"; do
            service="${services[$i]}"
            img_name="${img_names[$i]}"

            # all이 아니면 선택한 서비스만 처리
            if [[ "$TARGET_SERVICE" != "all" && "$service" != "$TARGET_SERVICE" ]]; then
              continue
            fi

            echo "Building and pushing $service ($img_name)..."
            docker build \
              --platform linux/amd64 \
              --build-arg BUILD_LIB_DIR="$service/build/libs" \
              --build-arg ARTIFACTORY_FILE="$service.jar" \
              -f deployment/container/Dockerfile-backend \
              -t $img_name:${{ needs.build.outputs.environment }}-${{ needs.build.outputs.image_tag }} .

            docker push $img_name:${{ needs.build.outputs.environment }}-${{ needs.build.outputs.image_tag }}
          done

  update-manifest:
    name: Update Manifest Repository
    needs: [build, release]
    runs-on: ubuntu-latest

    steps:
    - name: Set image tag environment variable
      run: |
        echo "IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> $GITHUB_ENV
        echo "ENVIRONMENT=${{ needs.build.outputs.environment }}" >> $GITHUB_ENV

    - name: Update Manifest Repository
      run: |
        # x-access-token 방식으로 PAT 인증 (특수문자 이슈 방지)
        git clone https://x-access-token:${{ secrets.GIT_PASSWORD }}@github.com/hiondal/lunchpick-manifest.git manifest-repo
        cd manifest-repo

        curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | tar xz
        sudo mv kustomize /usr/local/bin/

        # 매니페스트 업데이트
        cd lunchpick/kustomize/overlays/${{ env.ENVIRONMENT }}

        # 각 서비스별 이미지 태그 업데이트 (K8s Deployment YAML에서 추출한 이미지명)
        services=(member-service recommendation-service payment-service)
        img_names=(hiondal/lunchpick-member-service hiondal/lunchpick-recommendation-service hiondal/lunchpick-payment-service)
        TARGET_SERVICE="${{ github.event.inputs.SERVICE || 'all' }}"

        for i in "${!services[@]}"; do
          service="${services[$i]}"
          img_name="${img_names[$i]}"
          if [[ "$TARGET_SERVICE" != "all" && "$service" != "$TARGET_SERVICE" ]]; then
            continue
          fi
          kustomize edit set image $img_name=$img_name:${{ env.ENVIRONMENT }}-${{ env.IMAGE_TAG }}
        done

        # Git 설정 및 푸시
        cd ../../../..
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        git commit -m "Update lunchpick ${{ env.ENVIRONMENT }} images to ${{ env.ENVIRONMENT }}-${{ env.IMAGE_TAG }}"
        git push origin main

        echo "매니페스트 업데이트 완료. ArgoCD가 자동으로 배포합니다."
