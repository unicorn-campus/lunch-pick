name: Frontend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/package*.json'
      - 'frontend/tsconfig*.json'
      - 'frontend/next.config.*'
      - '.github/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      SKIP_SONARQUBE:
        description: 'Skip SonarQube Analysis'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  CLOUD: ${{ vars.CLOUD || 'GCP' }}
  REGISTRY: ${{ vars.REGISTRY }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_outputs.outputs.image_tag }}
      environment: ${{ steps.set_outputs.outputs.environment }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Determine environment
        id: determine_env
        run: |
          ENVIRONMENT="${{ github.event.inputs.ENVIRONMENT || vars.ENVIRONMENT || 'dev' }}"
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and Test
        working-directory: frontend
        run: |
          # npx로 직접 실행하여 prebuild 훅(generate-runtime-env.sh 등) 스킵
          # CI에서는 K8s ConfigMap이 runtime-env.js를 덮어쓰므로 생성 불필요
          NODE_OPTIONS="--max-old-space-size=3072" npx next build
          npm run lint || true

      - name: Add SonarQube host entry
        run: echo "${{ secrets.SONAR_HOST_IP }} mysonar.io" | sudo tee -a /etc/hosts

      - name: SonarQube Analysis & Quality Gate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          SKIP_SONARQUBE="${{ github.event.inputs.SKIP_SONARQUBE || 'false' }}"

          if [[ "$SKIP_SONARQUBE" == "true" ]]; then
            echo "Skipping SonarQube Analysis (SKIP_SONARQUBE=$SKIP_SONARQUBE)"
            exit 0
          fi

          npm install -g sonarqube-scanner
          sonar-scanner \
            -Dsonar.projectKey=frontend-${{ steps.determine_env.outputs.environment }} \
            -Dsonar.projectName=frontend-${{ steps.determine_env.outputs.environment }} \
            -Dsonar.sources=frontend/src \
            -Dsonar.tests=frontend/src \
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx \
            -Dsonar.exclusions=node_modules/**,dist/**,build/**,coverage/**,**/*.config.js,**/*.config.ts,scripts/** \
            -Dsonar.scm.disabled=true \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.typescript.tsconfigPaths=frontend/tsconfig.json \
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info \
            -Dsonar.javascript.node.maxspace=2048 \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN

      - name: Set outputs
        id: set_outputs
        run: |
          IMAGE_TAG=$(date +%Y%m%d%H%M%S)
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "environment=${{ steps.determine_env.outputs.environment }}" >> $GITHUB_OUTPUT

  release:
    name: Build and Push Docker Image
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set environment variables from build job
        run: |
          echo "REGISTRY=${{ vars.REGISTRY }}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${{ needs.build.outputs.environment }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # === GCP Artifact Registry ===
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Login to Google Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCR_REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -f deployment/container/Dockerfile-frontend \
            --build-arg PROJECT_FOLDER="frontend" \
            --build-arg BUILD_FOLDER="deployment/container" \
            -t asia-northeast3-docker.pkg.dev/lunchpick-489007/lunchpick/frontend:${{ needs.build.outputs.environment }}-${{ needs.build.outputs.image_tag }} .

          docker push asia-northeast3-docker.pkg.dev/lunchpick-489007/lunchpick/frontend:${{ needs.build.outputs.environment }}-${{ needs.build.outputs.image_tag }}

  update-manifest:
    name: Update Frontend Manifest Repository
    needs: [build, release]
    runs-on: ubuntu-latest

    steps:
    - name: Set image tag environment variable
      run: |
        echo "IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> $GITHUB_ENV
        echo "ENVIRONMENT=${{ needs.build.outputs.environment }}" >> $GITHUB_ENV

    - name: Update Frontend Manifest Repository
      run: |
        MANIFEST_REPO_PATH=$(echo "https://github.com/hiondal/lunchpick-manifest.git" | sed 's|https://github.com/||')
        git clone https://x-access-token:${{ secrets.GIT_PASSWORD }}@github.com/${MANIFEST_REPO_PATH} manifest-repo
        cd manifest-repo

        curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | tar xz
        sudo mv kustomize /usr/local/bin/

        cd frontend/kustomize/overlays/${{ env.ENVIRONMENT }}
        kustomize edit set image asia-northeast3-docker.pkg.dev/lunchpick-489007/lunchpick/frontend=asia-northeast3-docker.pkg.dev/lunchpick-489007/lunchpick/frontend:${{ env.ENVIRONMENT }}-${{ env.IMAGE_TAG }}

        cd ../../../..
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        git commit -m "Update frontend ${{ env.ENVIRONMENT }} image to ${{ env.ENVIRONMENT }}-${{ env.IMAGE_TAG }}"
        git push origin main

        echo "매니페스트 업데이트 완료. ArgoCD가 자동으로 배포합니다."
