name: AI Service CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ai-pipeline-service/**'
      - '.github/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      SKIP_SONARQUBE:
        description: 'Skip SonarQube Analysis'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  # Repository Variables에 CLOUD를 반드시 설정해야 합니다. 미설정 시 AWS로 동작합니다.
  CLOUD: ${{ vars.CLOUD || 'AWS' }}
  REGISTRY: ${{ vars.REGISTRY }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_outputs.outputs.image_tag }}
      environment: ${{ steps.set_outputs.outputs.environment }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Determine environment
        id: determine_env
        run: |
          ENVIRONMENT="${{ github.event.inputs.ENVIRONMENT || vars.ENVIRONMENT || 'dev' }}"
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          cd ai-pipeline-service
          pip install -r requirements.txt

      - name: Build and Test
        run: |
          cd ai-pipeline-service
          pytest || true

      - name: Add SonarQube host entry
        run: echo "${{ secrets.SONAR_HOST_IP }} mysonar.io" | sudo tee -a /etc/hosts

      - name: SonarQube Analysis & Quality Gate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          # Check if SonarQube should be skipped
          SKIP_SONARQUBE="${{ github.event.inputs.SKIP_SONARQUBE || 'false' }}"

          if [[ "$SKIP_SONARQUBE" == "true" ]]; then
            echo "Skipping SonarQube Analysis (SKIP_SONARQUBE=$SKIP_SONARQUBE)"
            exit 0
          fi

          npm install -g sonarqube-scanner
          sonar-scanner \
            -Dsonar.projectKey=ai-pipeline-service-${{ steps.determine_env.outputs.environment }} \
            -Dsonar.projectName=ai-pipeline-service-${{ steps.determine_env.outputs.environment }} \
            -Dsonar.sources=ai-pipeline-service \
            -Dsonar.tests=ai-pipeline-service/tests \
            -Dsonar.test.inclusions=**/test_*.py,**/*_test.py \
            -Dsonar.exclusions=**/__pycache__/**,**/venv/**,**/.venv/**,**/dist/** \
            -Dsonar.scm.disabled=true \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.language=python \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-dist
          path: ai-pipeline-service/

      - name: Set outputs
        id: set_outputs
        run: |
          # Generate timestamp for image tag
          IMAGE_TAG=$(date +%Y%m%d%H%M%S)
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "environment=${{ steps.determine_env.outputs.environment }}" >> $GITHUB_OUTPUT

  release:
    name: Build and Push Docker Image
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ai-dist
          path: ai-pipeline-service/

      - name: Set environment variables from build job
        run: |
          echo "REGISTRY=${{ vars.REGISTRY }}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${{ needs.build.outputs.environment }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (prevent rate limit)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Cloud-conditional registry login
      # === AWS ECR ===
      - name: Configure AWS credentials
        if: ${{ contains(env.REGISTRY, 'amazonaws.com') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.ECR_REGION }}

      - name: Login to Amazon ECR
        if: ${{ contains(env.REGISTRY, 'amazonaws.com') }}
        run: |
          aws ecr get-login-password --region ${{ vars.ECR_REGION }} | docker login --username AWS --password-stdin ${{ env.REGISTRY }}

      # === Azure ACR ===
      - name: Login to Azure Container Registry
        if: ${{ contains(env.REGISTRY, 'azurecr.io') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # === GCP Artifact Registry ===
      - name: Authenticate to Google Cloud
        if: ${{ contains(env.REGISTRY, 'pkg.dev') }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Login to Google Artifact Registry
        if: ${{ contains(env.REGISTRY, 'pkg.dev') }}
        run: |
          gcloud auth configure-docker ${{ vars.GCR_REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -f deployment/container/Dockerfile-ai \
            --build-arg PROJECT_FOLDER="ai-pipeline-service" \
            --build-arg EXPORT_PORT="8000" \
            -t hiondal/lunchpick-ai-pipeline-service:${{ needs.build.outputs.environment }}-${{ needs.build.outputs.image_tag }} .

          docker push hiondal/lunchpick-ai-pipeline-service:${{ needs.build.outputs.environment }}-${{ needs.build.outputs.image_tag }}

  update-manifest:
    name: Update AI Service Manifest Repository
    needs: [build, release]
    runs-on: ubuntu-latest

    steps:
    - name: Set image tag environment variable
      run: |
        echo "IMAGE_TAG=${{ needs.build.outputs.image_tag }}" >> $GITHUB_ENV
        echo "ENVIRONMENT=${{ needs.build.outputs.environment }}" >> $GITHUB_ENV

    - name: Update AI Service Manifest Repository
      run: |
        REPO_URL=$(echo "https://github.com/hiondal/lunchpick-manifest.git" | sed 's|https://||')
        git clone https://${{ secrets.GIT_USERNAME }}:${{ secrets.GIT_PASSWORD }}@${REPO_URL} manifest-repo
        cd manifest-repo

        curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | tar xz
        sudo mv kustomize /usr/local/bin/

        cd ai-pipeline-service/kustomize/overlays/${{ env.ENVIRONMENT }}
        kustomize edit set image hiondal/lunchpick-ai-pipeline-service=hiondal/lunchpick-ai-pipeline-service:${{ env.ENVIRONMENT }}-${{ env.IMAGE_TAG }}

        cd ../../../..
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        git commit -m "Update ai-pipeline-service ${{ env.ENVIRONMENT }} image to ${{ env.ENVIRONMENT }}-${{ env.IMAGE_TAG }}"
        git push origin main

        echo "매니페스트 업데이트 완료. ArgoCD가 자동으로 배포합니다."
