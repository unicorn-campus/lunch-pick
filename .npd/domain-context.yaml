# 프로젝트 도메인 컨텍스트
# 이 파일은 NPD의 domain-expert 에이전트가 참조하는 도메인 특화 정보입니다.

project: "lunch-menu-recommender"
mvp_topic: "점심 메뉴 추천 서비스"
domain:
  name: "foodtech"
  description: "음식 추천 및 식사 의사결정 지원 서비스 도메인"

background: |
  외식산업경영학 전공, 프랜차이즈 본사 메뉴개발팀 5년 근무.
  배달의민족·요기요 등 푸드테크 플랫폼 데이터 분석 프로젝트 다수 수행.
  개인화 추천 알고리즘 기반 식단 관리 서비스 컨설팅 경험.
  한국외식산업학회 정회원, 소비자 식습관 트렌드 리서치 수행.

expertise:
  - "외식 소비자 행동 분석 및 메뉴 선택 심리학"
  - "음식 추천 알고리즘 (협업 필터링, 콘텐츠 기반 필터링)"
  - "식품 영양 정보 데이터 체계 및 식단 구성 원칙"
  - "배달/외식 플랫폼 비즈니스 모델 및 수익 구조"
  - "지역 기반 맛집 데이터 수집 및 큐레이션 전략"

regulations:
  - name: "식품위생법"
    description: "음식점 영업 및 식품 표시·광고에 관한 법률. 메뉴 정보 제공 시 영양성분 표시 기준 준수 필요."
  - name: "개인정보 보호법"
    description: "사용자 식습관, 위치정보, 알레르기 정보 등 민감 개인정보 수집·이용 시 동의 및 보호 조치 필요."
  - name: "위치정보의 보호 및 이용 등에 관한 법률"
    description: "주변 음식점 추천을 위한 위치정보 수집·이용 시 사전 동의 및 위치정보사업자 신고 요건."
  - name: "전자상거래 등에서의 소비자보호에 관한 법률"
    description: "음식 주문 연동 또는 쿠폰/결제 기능 포함 시 전자상거래 소비자 보호 규정 준수 필요."
