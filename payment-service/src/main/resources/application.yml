spring:
  application:
    name: payment-service

  # PostgreSQL 데이터소스 (결제 이력 INSERT ONLY, 5년 보존)
  datasource:
    url: jdbc:${DB_KIND:postgresql}://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment}
    username: ${DB_USER:lunchpick}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # JPA 설정 (결제 이력은 DDL-AUTO=validate — INSERT ONLY 보호)
  jpa:
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_schema: lunchpick_payment
    hibernate:
      ddl-auto: ${DDL_AUTO:update}

  # Redis 설정 (DB 0: 구독 플랜 캐시, 활성 구독 캐시, 중복 결제 Lock, subscription-events Streams)
  # member-service와 동일한 DB 0을 사용하여 Streams 이벤트 수신 보장
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
      database: ${REDIS_DATABASE:0}

  # Redis Streams MQ 발행: subscription-events (spring-data-redis opsForStream 사용)

# MQ 토픽
mq:
  subscription:
    topic: ${MQ_SUBSCRIPTION_TOPIC:subscription-events}

server:
  port: ${SERVER_PORT:8083}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# JWT (모든 서비스 동일 시크릿)
jwt:
  secret: ${JWT_SECRET:}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:1800}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:86400}

# PG 게이트웨이
pg:
  gateway:
    url: ${PG_GATEWAY_URL:}
    merchant-id: ${PG_MERCHANT_ID:}
    secret-key: ${PG_SECRET_KEY:}

# Resilience4j Circuit Breaker (PG 게이트웨이 호출 보호)
resilience4j:
  circuitbreaker:
    instances:
      pg-gateway:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

# Logging
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.unicorn.lunchpick: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:INFO}
    org.hibernate.type: ${LOG_LEVEL_SQL_TYPE:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:logs/payment-service.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_ROLLING_FILE_PATTERN:logs/payment-service.%d{yyyy-MM-dd}.%i.log}
      max-file-size: ${LOG_MAX_FILE_SIZE:100MB}
      max-history: ${LOG_MAX_HISTORY:30}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:1GB}
